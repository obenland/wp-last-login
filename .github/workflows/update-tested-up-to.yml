name: Update Tested up to

on:
    schedule:
        - cron: '0 1 * * 5'
    workflow_dispatch:

permissions:
    contents: write
    pull-requests: write

concurrency:
    group: update-tested-up-to
    cancel-in-progress: false

jobs:
    check:
        name: Check for new WordPress version
        # Pin scheduled runs to trunk, but allow manual dispatch from any branch
        # for testing.
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/trunk'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: read
        outputs:
            needs_update: ${{ steps.check.outputs.needs_update }}
            version: ${{ steps.check.outputs.version }}
            full: ${{ steps.check.outputs.full }}
            previous: ${{ steps.check.outputs.previous }}
        steps:
            - uses: actions/checkout@v6
              with:
                  sparse-checkout: README.md
                  sparse-checkout-cone-mode: false

            - name: Compare latest WordPress against readme
              id: check
              shell: bash
              run: |
                  set -euo pipefail
                  latest=$(curl -fsSL --connect-timeout 30 --max-time 60 --retry 3 --retry-delay 2 https://api.wordpress.org/core/version-check/1.7/ | jq -r '.offers[0].version')
                  if ! [[ "$latest" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
                      echo "Unexpected WordPress version: '$latest'" >&2
                      exit 1
                  fi
                  short=$(echo "$latest" | awk -F. '{print $1"."$2}')
                  if ! [[ "$short" =~ ^[0-9]+\.[0-9]+$ ]]; then
                      echo "Failed to derive major.minor from '$latest'" >&2
                      exit 1
                  fi
                  current=$(sed -nE '/^[Tt]ested up to:/{s/^[Tt]ested up to:[[:space:]]+//;s/\r$//;p;q;}' README.md)
                  if [ -z "$current" ]; then
                      echo "Could not find 'Tested up to:' header in README.md" >&2
                      exit 1
                  fi
                  sorted=$(printf '%s\n%s\n' "$current" "$short" | sort -V)
                  older="${sorted%%$'\n'*}"
                  if [ "$current" = "$short" ] || [ "$older" != "$current" ]; then
                      echo "Current ($current) is at or ahead of target ($short); nothing to do."
                      echo "needs_update=false" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi
                  {
                      echo "needs_update=true"
                      echo "version=$short"
                      echo "full=$latest"
                      echo "previous=$current"
                  } >> "$GITHUB_OUTPUT"
                  echo "Bump needed: $current -> $short (WP $latest)"

    validate:
        name: Validate against latest WordPress
        needs: check
        if: needs.check.outputs.needs_update == 'true'
        permissions:
            contents: read
        runs-on: ubuntu-latest
        timeout-minutes: 30
        env:
            WP_ENV_CORE: 'https://wordpress.org/wordpress-latest.zip'
        steps:
            - uses: actions/checkout@v6

            - name: Setup Node.js (.nvmrc)
              uses: actions/setup-node@v6
              with:
                  node-version-file: '.nvmrc'
                  cache: npm

            - name: Cache Composer dependencies
              uses: actions/cache@v5
              id: composer-cache
              with:
                  path: vendor
                  key: composer-${{ hashFiles('composer.lock') }}

            - name: Install PHP dependencies
              if: steps.composer-cache.outputs.cache-hit != 'true'
              run: composer install --prefer-dist --no-progress

            - name: Cache Playwright browsers
              uses: actions/cache@v5
              id: playwright-cache
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

            - name: npm install
              env:
                  # See playwright.yml: skip the postinstall browser
                  # download so the cache restore above isn't redundant.
                  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
              run: npm ci

            - name: Install Playwright browsers
              if: steps.playwright-cache.outputs.cache-hit != 'true'
              run: npx playwright install --with-deps chromium

            - name: Start WordPress (latest stable)
              run: npm run wp-env start

            - name: Run PHP unit tests against latest WordPress
              run: npm run test-php

            - name: Run e2e tests against latest WordPress
              env:
                  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
              run: npm run test-e2e

            - name: Upload Playwright artifacts on failure
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: playwright-artifacts-update-tested-up-to
                  path: artifacts/
                  retention-days: 14

    update:
        needs: [check, validate]
        # Pin to trunk so a workflow_dispatch from a feature branch can't
        # auto-merge that branch's changes into trunk (peter-evans/create-pull-request
        # would otherwise produce a PR from the dispatched branch's tree).
        if: needs.check.outputs.needs_update == 'true' && github.ref == 'refs/heads/trunk'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - name: Update README.md
              shell: bash
              env:
                  TARGET: ${{ needs.check.outputs.version }}
                  PREVIOUS: ${{ needs.check.outputs.previous }}
              run: |
                  set -euo pipefail
                  sed -i -E "s/^([Tt]ested up to:[[:space:]]+).*/\1$TARGET/" README.md
                  new=$(sed -nE '/^[Tt]ested up to:/{s/^[Tt]ested up to:[[:space:]]+//;s/\r$//;p;q;}' README.md)
                  if [ "$new" != "$TARGET" ]; then
                      echo "sed did not produce expected value (got '$new')" >&2
                      exit 1
                  fi
                  echo "Bumped Tested up to: $PREVIOUS -> $TARGET"

            - name: Create Pull Request
              id: pr
              uses: peter-evans/create-pull-request@v8
              with:
                  token: ${{ secrets.WORKFLOW_PAT }}
                  sign-commits: true
                  base: trunk
                  commit-message: 'Bump Tested up to ${{ needs.check.outputs.version }}'
                  title: 'Bump Tested up to ${{ needs.check.outputs.version }}'
                  body: |
                      WordPress ${{ needs.check.outputs.full }} is the latest stable release.

                      Bumps `Tested up to` in README.md from ${{ needs.check.outputs.previous }} to ${{ needs.check.outputs.version }} (major.minor of ${{ needs.check.outputs.full }}).
                  branch: chore/tested-up-to-${{ needs.check.outputs.version }}
                  delete-branch: true

            - name: Merge PR
              if: steps.pr.outputs.pull-request-number
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
                  PR: ${{ steps.pr.outputs.pull-request-number }}
              run: |
                  set -euo pipefail
                  # Wait briefly for GitHub to finish computing mergeability for the new PR.
                  for _ in $(seq 1 12); do
                      state=$(gh pr view "$PR" --json mergeStateStatus --jq '.mergeStateStatus')
                      [ "$state" != "UNKNOWN" ] && break
                      sleep 5
                  done
                  echo "PR #$PR mergeStateStatus: $state"
                  case "$state" in
                      CLEAN | UNSTABLE)
                          # No required checks blocking — merge immediately.
                          gh pr merge --squash --delete-branch "$PR"
                          ;;
                      BLOCKED | BEHIND)
                          # Required PR checks (PHPUnit/Playwright) skip README-only changes, so they
                          # never report on this PR. The validate job already ran the same tests
                          # against latest WP before opening the PR, so bypass branch protection.
                          gh pr merge --admin --squash --delete-branch "$PR"
                          ;;
                      *)
                          echo "PR #$PR is in unexpected state: $state" >&2
                          exit 1
                          ;;
                  esac
                  # Poll until the merge actually completes, so the SVN sync below cannot
                  # publish ahead of trunk when --auto was used.
                  for _ in $(seq 1 60); do
                      merged_at=$(gh pr view "$PR" --json mergedAt --jq '.mergedAt')
                      if [ "$merged_at" != "null" ] && [ -n "$merged_at" ]; then
                          echo "PR #$PR merged at $merged_at"
                          exit 0
                      fi
                      sleep 10
                  done
                  echo "PR #$PR did not merge within 10 minutes" >&2
                  exit 1

            - name: Refresh workspace from merged trunk
              if: success() && steps.pr.outputs.pull-request-number
              shell: bash
              run: |
                  set -euo pipefail
                  # peter-evans/create-pull-request leaves the working tree at the pre-PR
                  # state, and the merge happens on the remote. Pull the post-merge trunk
                  # so the SVN sync below copies the actually-bumped README.md rather than
                  # the workspace's stale copy.
                  git fetch origin trunk
                  git reset --hard origin/trunk

            - name: Sync readme to WordPress.org SVN
              if: success() && steps.pr.outputs.pull-request-number
              uses: 10up/action-wordpress-plugin-asset-update@stable
              env:
                  SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
                  SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
                  README_NAME: README.md
                  IGNORE_OTHER_FILES: true