name: PHPUnit Coverage

on:
    pull_request:
        types: [opened, synchronize, reopened]
        paths-ignore:
            - '**/*.md'
            - 'readme.txt'
            - 'lang/**'
            - '.wordpress-org/**'
            - '.distignore'
            - '.editorconfig'
            - '.gitignore'

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read
    # The post-coverage step (`peter-evans/create-or-update-comment`) needs to
    # write the coverage summary back to the PR. Dependabot PRs run with a
    # read-only token by default, so without this the comment step fails
    # with "Resource not accessible by integration" and turns the whole
    # coverage check red.
    pull-requests: write

jobs:
    php-coverage:
        name: 'PHP Coverage Analysis'
        runs-on: ubuntu-latest
        timeout-minutes: 20
        env:
            WP_ENV_PHP_VERSION: '8.3'
            WP_ENV_CORE: 'https://wordpress.org/wordpress-latest.zip'

        steps:
            - uses: actions/checkout@v6

            - name: Setup Node.js (.nvmrc)
              uses: actions/setup-node@v6
              with:
                  node-version-file: '.nvmrc'
                  cache: npm

            - name: Cache Composer dependencies
              uses: actions/cache@v5
              id: composer-cache
              with:
                  path: vendor
                  key: composer-coverage-${{ hashFiles('composer.lock') }}

            - name: Install PHP dependencies
              if: steps.composer-cache.outputs.cache-hit != 'true'
              run: composer install --prefer-dist --no-progress

            - name: npm install
              run: npm ci

            - name: Install WordPress with Xdebug enabled
              run: npm run wp-env start -- --xdebug=coverage

            - name: Run PHPUnit with Coverage
              id: phpunit
              shell: bash
              run: |
                  set -euo pipefail
                  npm run test-php-coverage | tee coverage.log
                  filtered_output=$(sed -n '/^Code Coverage Report:/,$p' coverage.log)
                  echo "$filtered_output" | tee coverage-summary.txt
                  {
                      echo "coverage_summary<<EOF"
                      echo "$filtered_output"
                      echo "EOF"
                  } >> "$GITHUB_ENV"

            - name: Find Comment
              uses: peter-evans/find-comment@v4
              id: fc
              with:
                  issue-number: ${{ github.event.pull_request.number }}
                  comment-author: 'github-actions[bot]'
                  body-includes: PHPUnit Coverage Report

            - name: Create or Update Comment
              uses: peter-evans/create-or-update-comment@v5
              with:
                  comment-id: ${{ steps.fc.outputs.comment-id }}
                  issue-number: ${{ github.event.pull_request.number }}
                  body: |
                      ## PHPUnit Coverage Report

                      ```yaml
                      ${{ env.coverage_summary }}
                      ```
                  edit-mode: replace
